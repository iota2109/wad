<!DOCTYPE html>
<html>
<body>

    <h2>Registration Form</h2>
    
    <form onsubmit="return validate()">
        Name: <input type="text" id="n"><br><br>
        Phone: <input type="text" id="p"><br><br>
        Password: <input type="password" id="s"><br><br>
        <button type="submit">Register</button>
    </form>

    <script>
        function validate() {
            var name = document.getElementById("n").value;
            var phone = document.getElementById("p").value;
            var pass = document.getElementById("s").value;

            // 1. Check if empty
            if (name == "" || phone == "" || pass == "") {
                alert("Please fill all fields");
                return false;
            }

            // 2. Name check (Only letters and spaces)
            var namePattern = /^[A-Za-z\s]+$/;
            if (!namePattern.test(name)) {
                alert("Name can only contain letters");
                return false;
            }

            // 3. Phone check (Exactly 10 digits)
            var phonePattern = /^[0-9]{10}$/;
            if (!phonePattern.test(phone)) {
                alert("Phone must be 10 digits");
                return false;
            }

            // 4. Password length check
            if (pass.length < 6) {
                alert("Password too short");
                return false;
            }

            alert("Success!");
            return true;
        }
    </script>

</body>
</html>
