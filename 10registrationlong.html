<form onsubmit="alert('Registration Successful!'); return false;">
  Name: <input type="text" required><br>

  Pass: <input type="password" required><br>

  Email: <input type="email" placeholder="name@domain.com" required><br>

  Phone: 
  <select>
    <option>+91</option>
    <option>+358</option>
  </select>
  <input type="text" pattern="\d{10}" title="Exactly 10 digits" required><br>

  Sex: 
  <input type="radio" name="g" required> Male 
  <input type="radio" name="g"> Female<br>

  DOB:
  <select><option>Day</option><option>1</option><option>2</option></select>
  <select><option>Month</option><option>Jan</option><option>Feb</option></select>
  <select><option>Year</option><option>2000</option><option>2001</option></select><br>

  Languages:
  <input type="checkbox"> English
  <input type="checkbox"> Marathi
  <input type="checkbox"> Hindi
  <input type="checkbox"> Tamil<br>

  Address: <textarea required></textarea><br>

  <button>Submit</button>
</form>
